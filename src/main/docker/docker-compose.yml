name: coachku

services:
  coachku:
    build:
      context: .
      dockerfile: Dockerfile.jvm
    container_name: coachku
    ports:
      - "8091:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/q/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 5s
    networks:
      - all-container
    restart: always
    environment:
      - TZ=Asia/Jakarta
#      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/postgres
#      - QUARKUS_DATASOURCE_USERNAME=postgres
#      - QUARKUS_DATASOURCE_PASSWORD=postgres

networks:
  all-container:
    external: true